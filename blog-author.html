<!doctype html>
<html lang="zh-Hant-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>作者後台｜Edward LEE</title>  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/css/tokens.css"><link rel="stylesheet" href="/css/blog.css?v=1"><script type="module" src="/js/blog-author.js?v=1"></script></head><body class="blog-theme"><header class="blog-nav"><a class="brand" href="/blog/"><span class="mark">10×</span> EDWARD LEE</a><nav aria-label="作者導覽"><a href="/blog/">查看免費文章</a><span>作者後台</span></nav></header><main class="blog-wrap"><p id="author-message" class="message" role="status" aria-live="polite">正在確認登入狀態…</p>
<section id="login-panel" class="login-panel" hidden><h1>作者登入</h1><p class="muted">使用你的獨立作者密碼。</p><form id="login-form"><label for="author-password">作者密碼</label><input id="author-password" type="password" autocomplete="current-password" required maxlength="200"><button class="primary" type="submit">登入</button></form></section>
<section id="workspace" hidden><div class="author-toolbar"><h1>我的文章</h1><div class="editor-actions"><button class="secondary" id="new-post" type="button">＋ 新文章</button><button class="secondary" id="logout" type="button">登出</button></div></div><div class="author-layout"><aside><details open><summary>文章列表</summary><ul class="post-list" id="post-list"></ul><button class="secondary" id="reload-list" type="button">重新整理列表</button></details></aside><section aria-label="文章編輯器"><form id="editor-form" class="editor-form"><div><label for="post-title">文章標題</label><input id="post-title" required maxlength="100" placeholder="輸入文章標題"></div><div><label for="post-excerpt">摘要（選填，留空會從內文擷取）</label><textarea id="post-excerpt" maxlength="120" rows="2"></textarea></div><div class="field-pair"><div><label for="post-category">分類</label><input id="post-category" maxlength="24" value="研究筆記" list="category-options"><datalist id="category-options"><option value="研究筆記"><option value="公司分析"><option value="大市展望"><option value="投資方法"></datalist></div><div><label for="import-file">匯入已寫好的文章</label><input class="file-input" id="import-file" type="file" accept=".md,.markdown,.txt,text/plain,text/markdown"><p class="format-help">支援 UTF-8 Markdown 或文字檔，最大 350 KB。</p></div></div><div><label for="post-body">文章內文</label><textarea id="post-body" rows="18" maxlength="120000" required placeholder="在這裡開始寫文章…"></textarea><p class="format-help">可直接寫文字，或用 Markdown：# 小標題、**粗體**、- 清單、[連結文字](網址)。不執行 HTML。</p></div><p class="editor-status" id="editor-state">新文章 · 尚未儲存</p><div class="editor-actions"><button class="secondary" type="submit">儲存草稿</button><button class="secondary" id="preview-button" type="button">預覽</button><button class="secondary" id="export-button" type="button">匯出備份</button><button class="primary" id="publish-button" type="button">發佈文章</button><a class="read-link" id="live-link" target="_blank" rel="noopener noreferrer" hidden>查看已發佈文章 ↗</a></div></form><section class="preview-panel" id="preview-panel" hidden aria-label="文章預覽"><p class="eyebrow">發佈前預覽</p><h2 id="preview-title"></h2><div class="prose" id="preview-body"></div></section></section></div></section>
<dialog id="publish-dialog"><h2>發佈到免費文章？</h2><p>發佈後所有讀者都可以閱讀全文。</p><p class="muted" id="publish-title"></p><div class="editor-actions"><button class="secondary" id="cancel-publish" type="button">繼續編輯</button><button class="primary" id="confirm-publish" type="button">確認發佈</button></div></dialog>
<noscript>請啟用 JavaScript 使用作者後台。</noscript></main></body></html>
