<!DOCTYPE html>
<html lang="zh-Hant-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>港股2026中期業績｜行業首三高分選擇</title><style>:root{--bg:#080a0f;--p:#101620;--p2:#151e2b;--line:#29364a;--txt:#f0f4fa;--muted:#92a0b4;--gold:#e6b950;--green:#42dc92;--red:#ff727c;--blue:#5eaaff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#24314a,transparent 35%),var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang HK",sans-serif}.hidden{display:none!important}.lock{min-height:100vh;display:grid;place-items:center;padding:20px}.lockbox{width:min(430px,100%);background:var(--p);border:1px solid var(--line);border-radius:18px;padding:28px}.lockbox h1{font-size:1.3rem}.lockbox p{color:var(--muted);line-height:1.6}.lockbox input{width:100%;padding:12px;background:#080c12;border:1px solid var(--line);border-radius:8px;color:var(--txt);margin:8px 0}.lockbox button{width:100%;padding:12px;border:0;border-radius:8px;background:var(--gold);font-weight:800;cursor:pointer}.err{color:var(--red);min-height:20px}.app{max-width:1300px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;gap:15px}.eyebrow{color:var(--gold);font-size:.78rem;font-weight:800;letter-spacing:.14em}.head h1{margin:6px 0;font-size:clamp(1.45rem,3vw,2.3rem)}.sub{color:var(--muted)}.back{color:var(--gold);text-decoration:none;border:1px solid #68532a;border-radius:8px;padding:8px 11px;height:max-content}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:17px 0}.stat{background:var(--p);border:1px solid var(--line);border-radius:11px;padding:12px}.stat small{color:var(--muted)}.stat b{display:block;font-size:1.2rem;margin-top:4px}.tools{display:grid;grid-template-columns:2fr 1fr 1fr;gap:9px;background:var(--p);border:1px solid var(--line);border-radius:12px;padding:11px}.tools input,.tools select{background:#090d14;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:10px}.industry{margin:16px 0 7px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--p)}.industry-title{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;background:linear-gradient(90deg,#192438,#121923);border-bottom:1px solid var(--line)}.industry-title h2{margin:0;font-size:1rem}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px}.card{background:var(--p2);border:1px solid var(--line);border-radius:11px;padding:13px;cursor:pointer}.card:hover{border-color:#6b7d98}.rank{color:var(--gold);font-weight:900}.company{font-weight:800;margin:5px 0}.code,.meta{color:var(--muted);font-size:.78rem}.scoreline{display:flex;justify-content:space-between;align-items:end;margin:11px 0}.score{font-size:1.55rem;color:var(--green);font-weight:900}.growth{display:grid;grid-template-columns:1fr 1fr;gap:6px}.g{background:#0b111a;border-radius:7px;padding:7px;font-size:.75rem}.pos{color:var(--green)}.neg{color:var(--red)}.comment{color:#d8e0eb;line-height:1.6;font-size:.84rem;margin-top:10px}.overlay{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:30}.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:#101620;border:1px solid var(--line);border-radius:16px;padding:20px}.modal-head{display:flex;justify-content:space-between}.close{background:none;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:5px 9px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.mini{background:var(--p2);border-radius:8px;padding:9px}.mini small{display:block;color:var(--muted)}.modal p{line-height:1.75}.empty{text-align:center;color:var(--muted);padding:30px}.modal.wide{max-width:920px}.article-btn{display:inline-block;margin-top:14px;padding:9px 15px;border:1px solid var(--gold);border-radius:8px;background:transparent;color:var(--gold);font-weight:700;cursor:pointer;font-size:.86rem}.article-btn:hover{background:#e6b95014}.article{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);line-height:1.8;overflow-x:auto}.article h1,.article h2,.article h3{line-height:1.35;color:var(--txt)}.article table{border-collapse:collapse;width:100%;font-size:.88rem;margin:10px 0}.article th,.article td{border:1px solid var(--line);padding:6px 8px}.article blockquote{border-left:3px solid var(--gold);margin:12px 0;padding:4px 12px;color:var(--muted)}.article-loading{color:var(--muted);padding:14px 0}@media(max-width:850px){.cards{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.tools{grid-template-columns:1fr}.head{display:block}.back{display:inline-block;margin-top:10px}.grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.app{padding:12px}.stats,.grid{grid-template-columns:1fr}}</style></head><body>
<div id="lock" class="lock"><div class="lockbox"><div class="eyebrow">AI10XPRO 會員資料庫</div><h1>港股2026中期業績行業首三高分選擇</h1><p>12個大行業，每個行業評分最高三間公司。</p><input id="pw" type="password" placeholder="會員密碼" onkeydown="if(event.key==='Enter')unlock()"><button onclick="unlock()">解鎖</button><div id="err" class="err"></div></div></div>
<main id="app" class="app hidden"><header class="head"><div><div class="eyebrow">INDUSTRY TOP 3</div><h1>港股 2026 中期業績｜行業首三高分選擇</h1><div id="sub" class="sub"></div></div><a href="/" class="back">&#8592; 返回首頁</a> <a href="/login.html" class="back">&#8592; 返回資料庫首頁</a></header><section class="stats"><div class="stat"><small>入選公司</small><b id="sCompanies">—</b></div><div class="stat"><small>大行業</small><b id="sIndustries">—</b></div><div class="stat"><small>最高調整後評分</small><b id="sTop">—</b></div><div class="stat"><small>平均資料信心</small><b id="sConf">—</b></div></section><section class="tools"><input id="q" placeholder="搜尋代號、公司、行業或短評…" oninput="render()"><select id="ind" onchange="render()"><option value="">全部行業</option></select><select id="sort" onchange="render()"><option value="industry">按行業及排名</option><option value="score">按調整後評分</option><option value="market">按市場排名</option><option value="growth">按盈利增長</option></select></section><div id="content"></div></main><div id="overlay" class="overlay hidden" onclick="if(event.target===this)closeModal()"><div id="modal" class="modal"></div></div>
<script src="hk-top100-reports/vendor/marked.min.js"></script>
<script src="hk-top100-reports/vendor/purify.min.js"></script>
<script src="js/member-auth.js"></script>
<script>const URL='hk_h1_2026_industry_top3.enc?v=20260905';let M={},R=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=v=>v===null||v===undefined?null:Number(v);const one=v=>num(v)===null?'—':num(v).toFixed(1);const pct=v=>num(v)===null?'—':`${v>0?'+':''}${num(v).toFixed(1)}%`;const cls=v=>num(v)>=0?'pos':'neg';function money(v){v=num(v);if(v===null)return'—';if(Math.abs(v)>=1e12)return`HK$${(v/1e12).toFixed(2)}萬億`;if(Math.abs(v)>=1e9)return`HK$${(v/1e9).toFixed(2)}十億`;return`HK$${(v/1e6).toFixed(1)}百萬`}const key=(p,s)=>MemberAuth.deriveKey(p,s);/* 見 js/member-auth.js */async function unlock(ap){try{/* ap 係已登入存低的解密密碼(靠 cookie),手動輸入嗰個先要 login */let dataPassword=ap;if(!dataPassword){dataPassword=await MemberAuth.login(document.getElementById('pw').value);if(!dataPassword)throw Error('密碼錯誤')}const z=await fetch(URL,{cache:'no-store'});if(z.status===401)return MemberAuth.handleUnauthorized();const raw=Uint8Array.from(atob(await z.text()),c=>c.charCodeAt(0)),k=await key(dataPassword,raw.slice(0,16)),pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(16,28)},k,raw.slice(28));M=JSON.parse(new TextDecoder().decode(pt));R=M.rows;sessionStorage.setItem('unified_auth','1');sessionStorage.setItem('unified_auth_pw',dataPassword);document.getElementById('lock').classList.add('hidden');document.getElementById('app').classList.remove('hidden');init()}catch(e){document.getElementById('err').textContent='密碼錯誤、網絡錯誤或資料尚未部署'}}function init(){document.getElementById('sub').textContent=`${M.count}間公司 · ${M.industry_count}個大行業 · 更新 ${M.generated}`;document.getElementById('sCompanies').textContent=M.count;document.getElementById('sIndustries').textContent=M.industry_count;document.getElementById('sTop').textContent=one(Math.max(...R.map(x=>x.confidence_adjusted_score)));document.getElementById('sConf').textContent=one(R.reduce((a,x)=>a+x.data_confidence_score,0)/R.length);[...new Set(R.map(x=>x.major_industry))].sort().forEach(x=>document.getElementById('ind').insertAdjacentHTML('beforeend',`<option>${esc(x)}</option>`));render()}function render(){const q=document.getElementById('q').value.toLowerCase().trim(),ind=document.getElementById('ind').value,sort=document.getElementById('sort').value;let a=R.filter(x=>(!ind||x.major_industry===ind)&&(!q||`${x.code} ${x.name} ${x.major_industry} ${x.sub_industry} ${x.outlook_zh_tw}`.toLowerCase().includes(q)));if(sort==='score')a.sort((x,y)=>y.confidence_adjusted_score-x.confidence_adjusted_score);else if(sort==='market')a.sort((x,y)=>x.market_rank-y.market_rank);else if(sort==='growth')a.sort((x,y)=>(y.profit_yoy_pct??-Infinity)-(x.profit_yoy_pct??-Infinity));else a.sort((x,y)=>x.major_industry.localeCompare(y.major_industry,'zh-HK')||x.industry_rank-y.industry_rank);const groups={};a.forEach(x=>(groups[x.major_industry]??=[]).push(x));document.getElementById('content').innerHTML=Object.keys(groups).length?Object.entries(groups).map(([k,v])=>`<section class="industry"><div class="industry-title"><h2>${esc(k)}</h2><span class="meta">${v.length}間</span></div><div class="cards">${v.map(card).join('')}</div></section>`).join(''):'<div class="empty">沒有符合條件的公司</div>'}function card(x){return`<article class="card" onclick="openModal('${x.code}')"><div class="rank">行業第 ${x.industry_rank} 名</div><div class="company">${esc(x.name)}</div><div class="code">${esc(x.code)} · 市場第 ${x.market_rank} · ${esc(x.sub_industry)}</div><div class="scoreline"><div><span class="meta">信心調整後評分</span><div class="score">${one(x.confidence_adjusted_score)}</div></div><div class="meta">原始 ${one(x.outlook_score)}<br>信心 ${one(x.data_confidence_score)}</div></div><div class="growth"><div class="g">收入同比<br><b class="${cls(x.revenue_yoy_pct)}">${pct(x.revenue_yoy_pct)}</b></div><div class="g">盈利同比<br><b class="${cls(x.profit_yoy_pct)}">${pct(x.profit_yoy_pct)}</b></div></div><div class="comment">${esc(x.outlook_zh_tw)}</div></article>`}function openModal(c){const x=R.find(z=>z.code===c);document.getElementById('modal').classList.remove('wide');document.getElementById('modal').innerHTML=`<div class="modal-head"><div><div class="eyebrow">${esc(x.major_industry)} 行業第${x.industry_rank}</div><h2>${esc(x.name)} <span class="meta">${esc(x.code)}</span></h2></div><button class="close" onclick="closeModal()">關閉</button></div><div class="grid"><div class="mini"><small>調整後評分</small><b>${one(x.confidence_adjusted_score)}</b></div><div class="mini"><small>資料信心</small><b>${one(x.data_confidence_score)}</b></div><div class="mini"><small>市場排名</small><b>#${x.market_rank}</b></div><div class="mini"><small>最新市值</small><b>${money(x.market_cap_hkd)}</b></div><div class="mini"><small>20日平均成交額</small><b>${money(x.avg_turnover_20d_hkd)}</b></div><div class="mini"><small>細分行業</small><b>${esc(x.sub_industry)}</b></div></div><h3>前景短評</h3><p>${esc(x.outlook_zh_tw)}</p>${x.file?`<button class="article-btn" onclick="openArticle('${x.code}')">📄 查看完整深度報告 →</button><div id="article-box"></div>`:''}`;document.getElementById('overlay').classList.remove('hidden')}async function openArticle(code){const x=R.find(z=>z.code===code);const box=document.getElementById('article-box');document.getElementById('modal').classList.add('wide');box.innerHTML='<div class="article-loading">載入報告中…</div>';try{const r=await fetch('hk_h1_2026_industry_top3_data/'+encodeURIComponent(x.file),{cache:'no-store'});if(r.status===401)return MemberAuth.handleUnauthorized();if(!r.ok)throw new Error('讀取報告失敗('+r.status+')');const md=await r.text();box.innerHTML='<div class="article">'+DOMPurify.sanitize(marked.parse(md,{breaks:true,gfm:true}))+'</div>'}catch(e){box.innerHTML=`<div class="article-loading">${esc(e.message)}</div>`}}function closeModal(){document.getElementById('overlay').classList.add('hidden')}window.addEventListener('DOMContentLoaded',async()=>{/* sessionStorage 只限本分頁;新分頁/書籤入嚟就靠 cookie 回復登入 */const p=sessionStorage.getItem('unified_auth_pw')||await MemberAuth.resume();if(p)unlock(p)});</script></body></html>
