<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>港股 2026 中期業績前景庫｜AI10XPRO</title>
<style>
:root{--bg:#07090d;--panel:#0e131b;--panel2:#131b26;--line:#243044;--text:#eef3fa;--muted:#8d9bb0;--gold:#e0b44f;--green:#39d98a;--red:#ff6b74;--blue:#59a7ff;--purple:#a98bff;--yellow:#ffd166}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#17233a 0,transparent 34%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang HK",sans-serif}button,input,select{font:inherit}.hidden{display:none!important}.lock{min-height:100vh;display:grid;place-items:center;padding:24px}.lock-card{width:min(440px,100%);background:rgba(14,19,27,.96);border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:0 24px 70px #0008}.lock h1{font-size:1.35rem;margin:0 0 8px}.lock p{color:var(--muted);line-height:1.6}.lock input{width:100%;padding:13px;border:1px solid var(--line);border-radius:9px;background:#080c12;color:var(--text);margin:10px 0}.primary{width:100%;padding:12px;border:0;border-radius:9px;background:var(--gold);color:#17120a;font-weight:800;cursor:pointer}.err{color:var(--red);min-height:22px;margin-top:8px}.app{max-width:1500px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:18px}.eyebrow{color:var(--gold);font-size:.78rem;font-weight:800;letter-spacing:.15em}.top h1{font-size:clamp(1.5rem,3vw,2.45rem);margin:6px 0 7px}.subtitle{color:var(--muted)}.back{color:var(--gold);text-decoration:none;border:1px solid #5a4825;border-radius:9px;padding:9px 12px;white-space:nowrap}.kpis{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:10px;margin:16px 0}.kpi{background:linear-gradient(145deg,var(--panel),#101827);border:1px solid var(--line);border-radius:12px;padding:13px}.kpi .label{font-size:.76rem;color:var(--muted)}.kpi .value{font-size:1.25rem;font-weight:800;margin-top:5px}.toolbar{background:rgba(14,19,27,.93);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:2fr repeat(4,1fr);gap:9px;position:sticky;top:6px;z-index:5;backdrop-filter:blur(12px)}.toolbar input,.toolbar select{min-width:0;background:#090e15;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px}.chips{display:flex;gap:7px;overflow:auto;padding:11px 1px 5px}.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:7px 11px;white-space:nowrap;cursor:pointer}.chip.active{border-color:var(--gold);color:var(--gold);background:#e0b44f12}.table-wrap{border:1px solid var(--line);border-radius:14px;overflow:auto;background:var(--panel);margin-top:8px}table{width:100%;border-collapse:collapse;min-width:1080px}th{position:sticky;top:0;background:#111824;color:var(--muted);font-size:.76rem;text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:10px 9px;border-bottom:1px solid #1c2635;font-size:.86rem;vertical-align:middle}.main-row{cursor:pointer}.main-row:hover{background:#162033}.rank{color:var(--muted);font-variant-numeric:tabular-nums}.company b{display:block}.company small{color:var(--muted)}.score{font-weight:900;font-size:1rem}.score.hi{color:var(--green)}.score.md{color:var(--yellow)}.score.lo{color:var(--red)}.pill{display:inline-block;border:1px solid var(--line);padding:3px 7px;border-radius:999px;font-size:.72rem;margin:2px}.pill.green{border-color:#267e59;color:var(--green)}.pill.red{border-color:#8b3742;color:var(--red)}.pill.gold{border-color:#7c642d;color:var(--gold)}.pos{color:var(--green)}.neg{color:var(--red)}.muted{color:var(--muted)}.detail-row td{padding:0;background:#090e15}.detail{padding:18px 20px;display:grid;gap:16px}.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.mini{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px}.mini .l{color:var(--muted);font-size:.73rem}.mini .v{font-weight:750;margin-top:4px}.section{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:14px}.section h3{font-size:.9rem;color:var(--gold);margin:0 0 8px}.section p{margin:0;line-height:1.75;white-space:pre-wrap;word-break:break-word}.score-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.barbox{background:var(--panel2);border-radius:9px;padding:9px}.bar-title{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}.bar{height:6px;background:#253044;border-radius:9px;margin-top:7px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--green))}.resultline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);padding:11px 2px}.pager{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:15px}.pager button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:7px;padding:7px 10px;cursor:pointer}.pager button.active{border-color:var(--gold);color:var(--gold)}@media(max-width:950px){.kpis{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.detail-grid,.score-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.app{padding:12px}.top{display:block}.back{display:inline-block;margin-top:12px}.kpis{grid-template-columns:1fr 1fr}.toolbar{position:static;grid-template-columns:1fr}.toolbar input{grid-column:auto}.detail-grid,.score-grid{grid-template-columns:1fr}.kpi .value{font-size:1.05rem}}
</style>
</head>
<body>
<div id="lock" class="lock"><div class="lock-card"><div class="eyebrow">AI10XPRO 會員資料庫</div><h1>港股 2026 中期業績前景庫</h1><p>請輸入會員密碼。從登入首頁進入時會自動解鎖。</p><input id="pw" type="password" placeholder="會員密碼" onkeydown="if(event.key==='Enter')unlock()"><button class="primary" onclick="unlock()">解鎖資料庫</button><div id="err" class="err"></div></div></div>
<main id="app" class="app hidden">
<header class="top"><div><div class="eyebrow">2026 H1 EARNINGS OUTLOOK</div><h1>港股 2026 中期業績前景庫</h1><div id="subtitle" class="subtitle"></div></div><a class="back" href="login.html">← 返回資料庫首頁</a></header>
<section class="kpis"><div class="kpi"><div class="label">公司數量</div><div id="kCount" class="value">—</div></div><div class="kpi"><div class="label">信心調整後評分中位數</div><div id="kMedian" class="value">—</div></div><div class="kpi"><div class="label">轉虧為盈</div><div id="kTurn" class="value">—</div></div><div class="kpi"><div class="label">收入錄得增長</div><div id="kGrowth" class="value">—</div></div><div class="kpi"><div class="label">資料高信心</div><div id="kConf" class="value">—</div></div></section>
<section class="toolbar"><input id="search" placeholder="搜尋代號、公司、行業或短評…" oninput="apply()"><select id="industry" onchange="apply()"><option value="">全部大行業</option></select><select id="confidence" onchange="apply()"><option value="">全部信心級別</option><option>高</option><option>中</option><option>低</option></select><select id="flag" onchange="apply()"><option value="">全部狀況</option><option value="turnaround">轉虧為盈</option><option value="deterioration">業績轉差</option><option value="one_off">一次性因素</option></select><select id="sort" onchange="apply()"><option value="adjusted_desc">信心調整後評分 ↓</option><option value="market_rank">市場排名 ↑</option><option value="industry_rank">行業排名 ↑</option><option value="market_cap">市值 ↓</option><option value="revenue">收入增長 ↓</option><option value="profit">盈利增長 ↓</option><option value="confidence">資料信心 ↓</option></select></section>
<div id="chips" class="chips"></div><div class="resultline"><span id="resultCount"></span><span>點擊公司可展開完整分析</span></div>
<div class="table-wrap"><table><thead><tr><th>市場排名</th><th>公司</th><th>大行業／行業排名</th><th>調整後評分</th><th>前景評分</th><th>收入同比</th><th>盈利同比</th><th>信心</th><th>標記</th></tr></thead><tbody id="body"></tbody></table></div><div id="pager" class="pager"></div>
</main>
<script>
const DATA_URL='hk_h1_2026_data.enc?v=20260902';let META={},ROWS=[],VIEW=[],PAGE=1,PER=40,ACTIVE_INDUSTRY='';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>v===null||v===undefined||v===''?null:Number(v);const one=v=>n(v)===null?'—':Number(v).toFixed(1);const pct=v=>n(v)===null?'—':`${v>0?'+':''}${Number(v).toFixed(1)}%`;const pclass=v=>n(v)===null?'muted':v>=0?'pos':'neg';
function money(v){v=n(v);if(v===null)return'—';const a=Math.abs(v);if(a>=1e12)return`HK$${(v/1e12).toFixed(2)}萬億`;if(a>=1e9)return`HK$${(v/1e9).toFixed(2)}十億`;if(a>=1e6)return`HK$${(v/1e6).toFixed(1)}百萬`;return`HK$${v.toLocaleString('zh-HK')}`}
async function derive(pw,salt){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt'])}
async function unlock(autoPw){const pw=autoPw||document.getElementById('pw').value,err=document.getElementById('err');err.textContent='';try{const res=await fetch(DATA_URL,{cache:'no-store'});if(!res.ok)throw Error('資料檔不存在');const raw=Uint8Array.from(atob(await res.text()),c=>c.charCodeAt(0)),key=await derive(pw,raw.slice(0,16)),pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(16,28)},key,raw.slice(28));META=JSON.parse(new TextDecoder().decode(pt));ROWS=META.rows||[];sessionStorage.setItem('unified_auth','1');sessionStorage.setItem('unified_auth_pw',pw);document.getElementById('lock').classList.add('hidden');document.getElementById('app').classList.remove('hidden');init()}catch(e){err.textContent='密碼錯誤、網絡錯誤或資料尚未部署';if(autoPw)document.getElementById('pw').value=autoPw}}
function init(){document.getElementById('subtitle').textContent=`${META.count} 間港股 · ${META.industry_count} 個大行業 · 市場數據 ${META.market_data_date} · 更新 ${META.generated}`;document.getElementById('kCount').textContent=META.count;const scores=ROWS.map(r=>r.adjusted_score).filter(v=>v!==null).sort((a,b)=>a-b);document.getElementById('kMedian').textContent=one(scores[Math.floor(scores.length/2)]);document.getElementById('kTurn').textContent=ROWS.filter(r=>r.turnaround).length;document.getElementById('kGrowth').textContent=ROWS.filter(r=>n(r.revenue_yoy)>0).length;document.getElementById('kConf').textContent=ROWS.filter(r=>r.confidence_level==='高').length;const counts={};ROWS.forEach(r=>counts[r.major_industry]=(counts[r.major_industry]||0)+1);const sel=document.getElementById('industry');Object.keys(counts).sort().forEach(k=>sel.insertAdjacentHTML('beforeend',`<option value="${esc(k)}">${esc(k)} (${counts[k]})</option>`));document.getElementById('chips').innerHTML=`<button class="chip active" data-i="" onclick="quickIndustry(this,'')">全部 ${ROWS.length}</button>`+Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<button class="chip" data-i="${esc(k)}" onclick="quickIndustry(this,'${esc(k)}')">${esc(k)} ${v}</button>`).join('');apply()}
function quickIndustry(btn,k){ACTIVE_INDUSTRY=k;document.getElementById('industry').value=k;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));btn.classList.add('active');apply()}
function apply(){const q=document.getElementById('search').value.trim().toLowerCase(),ind=document.getElementById('industry').value,conf=document.getElementById('confidence').value,flag=document.getElementById('flag').value,sort=document.getElementById('sort').value;VIEW=ROWS.filter(r=>(!ind||r.major_industry===ind)&&(!conf||r.confidence_level===conf)&&(!flag||r[flag])&&(!q||`${r.code} ${r.name} ${r.major_industry} ${r.sub_industry} ${r.outlook_comment} ${r.financial_summary}`.toLowerCase().includes(q)));const val=(r,k)=>n(r[k])??-Infinity;if(sort==='market_rank')VIEW.sort((a,b)=>a.market_rank-b.market_rank);else if(sort==='industry_rank')VIEW.sort((a,b)=>a.major_industry.localeCompare(b.major_industry,'zh-HK')||a.industry_rank-b.industry_rank);else if(sort==='market_cap')VIEW.sort((a,b)=>val(b,'market_cap_hkd')-val(a,'market_cap_hkd'));else if(sort==='revenue')VIEW.sort((a,b)=>val(b,'revenue_yoy')-val(a,'revenue_yoy'));else if(sort==='profit')VIEW.sort((a,b)=>val(b,'profit_yoy')-val(a,'profit_yoy'));else if(sort==='confidence')VIEW.sort((a,b)=>val(b,'confidence_score')-val(a,'confidence_score'));else VIEW.sort((a,b)=>val(b,'adjusted_score')-val(a,'adjusted_score'));PAGE=1;render()}
function scoreClass(s){return n(s)>=70?'hi':n(s)>=50?'md':'lo'}function flags(r){let x=[];if(r.turnaround)x.push('<span class="pill green">轉虧為盈</span>');if(r.deterioration)x.push('<span class="pill red">轉差</span>');if(r.one_off)x.push('<span class="pill gold">一次性因素</span>');return x.join('')||'<span class="muted">—</span>'}
function render(){const start=(PAGE-1)*PER,part=VIEW.slice(start,start+PER);document.getElementById('resultCount').textContent=`符合條件：${VIEW.length} 間`;document.getElementById('body').innerHTML=part.map(r=>`<tr class="main-row" onclick="toggle('${r.code}')"><td class="rank">#${r.market_rank}</td><td class="company"><b>${esc(r.name)}</b><small>${esc(r.code)} · ${esc(r.sub_industry||'')}</small></td><td>${esc(r.major_industry)}<div class="muted">#${r.industry_rank} / ${r.industry_total}</div></td><td><span class="score ${scoreClass(r.adjusted_score)}">${one(r.adjusted_score)}</span></td><td>${one(r.outlook_score)}</td><td class="${pclass(r.revenue_yoy)}">${pct(r.revenue_yoy)}</td><td class="${pclass(r.profit_yoy)}">${pct(r.profit_yoy)}</td><td>${esc(r.confidence_level)} <span class="muted">${one(r.confidence_score)}</span></td><td>${flags(r)}</td></tr><tr id="d-${r.code}" class="detail-row hidden"><td colspan="9">${detail(r)}</td></tr>`).join('');pager()}
function mini(l,v){return`<div class="mini"><div class="l">${esc(l)}</div><div class="v">${v}</div></div>`}function bar(l,v,max){const w=Math.max(0,Math.min(100,(n(v)||0)/max*100));return`<div class="barbox"><div class="bar-title"><span>${esc(l)}</span><b>${one(v)}</b></div><div class="bar"><div class="fill" style="width:${w}%"></div></div></div>`}
function detail(r){return`<div class="detail"><div class="detail-grid">${mini('最新股價',money(r.price_hkd))}${mini('最新市值',money(r.market_cap_hkd))}${mini('20日平均成交額',money(r.avg_turnover_20d_hkd))}${mini('公布日期',esc(r.release_date||'—'))}${mini('收入同比',`<span class="${pclass(r.revenue_yoy)}">${pct(r.revenue_yoy)}</span>`)}${mini('盈利同比',`<span class="${pclass(r.profit_yoy)}">${pct(r.profit_yoy)}</span>`)}${mini('經營溢利同比',`<span class="${pclass(r.operating_profit_yoy)}">${pct(r.operating_profit_yoy)}</span>`)}${mini('經營現金流同比',`<span class="${pclass(r.operating_cashflow_yoy)}">${pct(r.operating_cashflow_yoy)}</span>`)}</div><div class="section"><h3>評分拆解</h3><div class="score-grid">${bar('當前動能',r.momentum,25)}${bar('增長質素',r.growth_quality,15)}${bar('前瞻可見度',r.visibility,20)}${bar('競爭地位',r.competitive_position,10)}${bar('資產負債及資本配置',r.balance_capital,10)}${bar('管理層執行力',r.management_execution,10)}${bar('增長選擇性',r.growth_optionality,10)}${bar('風險扣分',r.risk_deduction,20)}</div></div><div class="section"><h3>前景短評</h3><p>${esc(r.outlook_comment||'未提供')}</p></div><div class="section"><h3>核心財務摘要</h3><p>${esc(r.financial_summary||'未提供')}</p></div><div class="section"><h3>6–18個月展望</h3><p>${esc(r.outlook_6_18m||'未提供')}</p></div><div class="muted">業績期：${esc(r.period||'未提供')} · 業績類型：${esc(r.result_type||'未提供')} · 市場數據日期：${esc(r.market_data_date||'未提供')} · 毛利率變動：${r.gross_margin_change_ppt===null?'—':one(r.gross_margin_change_ppt)+' 個百分點'}</div></div>`}
function toggle(code){document.getElementById('d-'+code).classList.toggle('hidden')}function pager(){const pages=Math.max(1,Math.ceil(VIEW.length/PER)),el=document.getElementById('pager');let a=[];if(PAGE>1)a.push(`<button onclick="go(${PAGE-1})">‹</button>`);for(let p=Math.max(1,PAGE-3);p<=Math.min(pages,PAGE+3);p++)a.push(`<button class="${p===PAGE?'active':''}" onclick="go(${p})">${p}</button>`);if(PAGE<pages)a.push(`<button onclick="go(${PAGE+1})">›</button>`);el.innerHTML=a.join('')}function go(p){PAGE=p;render();scrollTo({top:0,behavior:'smooth'})}
window.addEventListener('DOMContentLoaded',()=>{const p=sessionStorage.getItem('unified_auth_pw');if(p){document.getElementById('pw').value=p;unlock(p)}});
</script>
</body>
</html>
