<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="港股2026中期業績前景庫2026年8月20日歷史公開快照，303間公司、307份業績記錄。">
<meta name="robots" content="index,follow">
<title>港股2026中期業績｜8月20日歷史公開版</title>
<style>
:root{--bg:#070a10;--panel:#0d131e;--panel2:#121b29;--line:#253247;--text:#edf3fb;--muted:#91a0b5;--gold:#d4a647;--green:#3ed68d;--red:#ff707a;--blue:#5eaaff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -12%,#21304b 0,transparent 33%),var(--bg);color:var(--text);font-family:"Noto Sans TC","PingFang TC",system-ui,sans-serif;min-height:100vh}a{color:inherit;text-decoration:none}.top{position:sticky;top:0;z-index:20;background:#080c13e8;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.nav{max-width:1500px;margin:auto;padding:11px 20px;display:flex;gap:10px;justify-content:space-between;align-items:center}.navlinks{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:10px;border:1px solid var(--line);color:#cbd5e4;font-weight:700;font-size:13px}.btn:hover{border-color:var(--gold);color:#ffe09a}.btn.gold{background:#d4a64718;border-color:#d4a64766;color:#ffd780}.hero{max-width:1500px;margin:auto;padding:42px 20px 24px}.eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.15em}.hero h1{margin:9px 0 10px;font-size:clamp(25px,4vw,46px);line-height:1.2}.hero p{color:var(--muted);line-height:1.7;max-width:980px}.notice{margin-top:17px;padding:13px 15px;border:1px solid #d4a64755;border-radius:12px;background:#d4a6470d;color:#dcc894;font-size:13px}.wrap{max-width:1500px;margin:auto;padding:0 20px 40px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 16px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px}.stat small{display:block;color:var(--muted);font-size:12px}.stat b{display:block;margin-top:4px;font-size:25px;color:#fff}.filters{display:grid;grid-template-columns:minmax(220px,1.5fr) repeat(3,minmax(145px,.7fr));gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:12px}.filters input,.filters select{width:100%;background:#090e16;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}.filters input:focus,.filters select:focus{border-color:var(--gold)}.summary{display:flex;justify-content:space-between;gap:12px;align-items:center;color:var(--muted);font-size:13px;margin:12px 2px}.tablebox{border:1px solid var(--line);border-radius:15px;overflow:auto;background:var(--panel)}table{width:100%;border-collapse:collapse;min-width:1050px}th{position:sticky;top:53px;background:#111a28;color:#94a5bd;font-size:11px;text-align:left;padding:11px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:12px 11px;border-bottom:1px solid #1b2637;font-size:13px;vertical-align:top}tr.data:hover{background:#141e2c;cursor:pointer}.score{font-weight:900;color:var(--gold);font-size:18px}.code{font-family:ui-monospace,monospace;color:#7fb9ff}.name{font-weight:800;color:#fff}.muted{color:var(--muted)}.clip{max-width:330px;line-height:1.45;color:#c7d2e1}.pill{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;margin:1px;border:1px solid #34435b;color:#c6d3e6}.pager{display:flex;justify-content:center;align-items:center;gap:8px;padding:17px}.pager button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:8px 12px;cursor:pointer}.pager button:disabled{opacity:.35;cursor:default}.modal{position:fixed;inset:0;z-index:50;background:#030509dd;display:none;align-items:flex-start;justify-content:center;padding:24px;overflow:auto}.modal.open{display:flex}.dialog{width:min(1120px,100%);background:#0b111b;border:1px solid #33435d;border-radius:18px;box-shadow:0 25px 80px #000;overflow:hidden}.dialogHead{position:sticky;top:0;z-index:2;background:#0e1622ee;backdrop-filter:blur(12px);padding:17px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px}.dialogHead h2{margin:0;font-size:21px}.close{background:transparent;border:1px solid var(--line);color:#fff;border-radius:9px;width:36px;height:36px;cursor:pointer}.dialogBody{padding:19px}.record{border:1px solid var(--line);border-radius:14px;margin-bottom:18px;overflow:hidden}.recordHead{padding:13px 15px;background:#121b29;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.recordBody{padding:15px}.scoregrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:15px}.metric{background:#0a0f17;border:1px solid #202c3e;border-radius:10px;padding:10px}.metric small{color:var(--muted)}.metric b{display:block;margin-top:3px}.bar{height:5px;background:#263247;border-radius:4px;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#d4a647,#ffd77a)}.sections{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.section{background:#090e16;border:1px solid #202c3e;border-radius:11px;padding:12px}.section h3{margin:0 0 9px;color:#e7bd58;font-size:14px}.field{margin:9px 0}.field label{display:block;color:#718198;font-size:11px;font-weight:800;margin-bottom:3px}.field div{color:#d6dfeb;line-height:1.58;white-space:pre-wrap}.loading,.error{text-align:center;padding:60px 20px;color:var(--muted)}.error{color:#ff8f96}@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.sections,.scoregrid{grid-template-columns:1fr}.nav{align-items:flex-start}.navlinks{justify-content:flex-end}.hero{padding-top:30px}}@media(max-width:520px){.filters{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.modal{padding:8px}.dialogBody{padding:10px}.recordBody{padding:10px}.btn{padding:8px 9px}}
</style>
</head>
<body>
<div class="top"><div class="nav"><a class="btn" href="free-tools.html">← 免費內容中心</a><div class="navlinks"><a class="btn" href="/">首頁</a><a class="btn gold" href="login.html">🔐 最新會員版</a></div></div></div>
<header class="hero"><div class="eyebrow">FREE HISTORICAL SNAPSHOT · 免費歷史快照</div><h1>港股2026中期業績前景庫</h1><p>2026年8月20日歷史公開版本。公司層面整合為303間，保留307份原始業績記錄及29個研究欄位；三間公司有多於一個業績期，可在詳情內逐份查閱。</p><div class="notice">⚠️ 此頁係2026-08-20歷史快照，唔會隨最新業績更新。最新801間完整資料及行業首三選擇請由會員入口查看。</div></header>
<main class="wrap"><section class="stats"><div class="stat"><small>公司數目</small><b id="sCompanies">—</b></div><div class="stat"><small>業績記錄</small><b id="sRecords">—</b></div><div class="stat"><small>最高評分</small><b id="sTop">—</b></div><div class="stat"><small>平均評分</small><b id="sAvg">—</b></div></section><section class="filters"><input id="q" placeholder="搜尋代號、公司、行業、核心判斷…"><select id="industry"><option value="">全部行業／模式</option></select><select id="category"><option value="">全部分類</option></select><select id="sort"><option value="score_desc">評分：高至低</option><option value="score_asc">評分：低至高</option><option value="code">股票代號</option><option value="name">公司名稱</option></select></section><div class="summary"><span id="resultText">載入中…</span><span>點擊任何公司查看完整詳情</span></div><div id="content" class="tablebox"><div class="loading">正在載入303間公司歷史資料…</div></div><div id="pager" class="pager"></div></main>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="dialog"><div class="dialogHead"><div><h2 id="modalTitle"></h2><div id="modalSub" class="muted"></div></div><button class="close" onclick="closeModal()">✕</button></div><div id="modalBody" class="dialogBody"></div></div></div>
<script>
const DATA_URL='hk_h1_2026_archive_20260820.json?v=20260902';let META={},ALL=[],VIEW=[],page=1;const PAGE=30;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const text=(v,fallback='—')=>v===null||v===undefined||String(v).trim()===''?fallback:String(v);
const primary=c=>c.records[0]||{};
const score=v=>{const n=Number(v);return Number.isFinite(n)?n:null};
function excerpt(v,n=105){v=text(v,'');return v.length>n?v.slice(0,n)+'…':v}
function uniq(vals){return [...new Set(vals.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'zh-Hant'))}
async function init(){try{const r=await fetch(DATA_URL,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);META=await r.json();ALL=META.companies||[];if(META.company_count!==303||META.record_count!==307)throw new Error('資料數目不符');populate();document.getElementById('sCompanies').textContent=META.company_count;document.getElementById('sRecords').textContent=META.record_count;const vals=ALL.map(c=>score(primary(c).score)).filter(v=>v!==null);document.getElementById('sTop').textContent=Math.max(...vals);document.getElementById('sAvg').textContent=(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1);apply()}catch(e){document.getElementById('content').innerHTML='<div class="error">資料載入失敗：'+esc(e.message)+'</div>'}}
function populate(){const add=(id,vals)=>{const el=document.getElementById(id);vals.forEach(v=>el.insertAdjacentHTML('beforeend','<option value="'+esc(v)+'">'+esc(v)+'</option>'))};add('industry',uniq(ALL.map(c=>primary(c).industry)));add('category',uniq(ALL.map(c=>primary(c).category)))}
function apply(){const q=document.getElementById('q').value.trim().toLowerCase(),ind=document.getElementById('industry').value,cat=document.getElementById('category').value,sortBy=document.getElementById('sort').value;VIEW=ALL.filter(c=>{const r=primary(c),hay=[c.code,c.name,r.industry,r.category,r.stage,r.core_judgment,r.financials,r.catalyst,r.risk].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!ind||r.industry===ind)&&(!cat||r.category===cat)});VIEW.sort((a,b)=>{const x=primary(a),y=primary(b);if(sortBy==='score_desc')return(score(y.score)??-999)-(score(x.score)??-999);if(sortBy==='score_asc')return(score(x.score)??999)-(score(y.score)??999);if(sortBy==='code')return String(a.code).localeCompare(String(b.code),undefined,{numeric:true});return String(a.name).localeCompare(String(b.name),'zh-Hant')});page=1;render()}
function render(){document.getElementById('resultText').textContent='符合條件：'+VIEW.length+'間公司';const start=(page-1)*PAGE,rows=VIEW.slice(start,start+PAGE);let html='<table><thead><tr><th>評分</th><th>股票／公司</th><th>行業／模式</th><th>發展階段</th><th>分類</th><th>業績期</th><th>核心判斷</th><th>記錄</th></tr></thead><tbody>';rows.forEach((c,i)=>{const r=primary(c),idx=start+i;html+='<tr class="data" onclick="openCompany('+idx+')"><td><span class="score">'+esc(text(r.score))+'</span></td><td><div class="code">'+esc(c.code)+'</div><div class="name">'+esc(c.name)+'</div></td><td>'+esc(text(r.industry))+'</td><td><span class="pill">'+esc(text(r.stage))+'</span></td><td><span class="pill">'+esc(text(r.category))+'</span></td><td>'+esc(text(r.period))+'</td><td class="clip">'+esc(excerpt(r.core_judgment))+'</td><td>'+(c.records.length>1?'<span class="pill">'+c.records.length+'份</span>':'1份')+'</td></tr>'});html+='</tbody></table>';document.getElementById('content').innerHTML=html;const pages=Math.max(1,Math.ceil(VIEW.length/PAGE));document.getElementById('pager').innerHTML='<button '+(page<=1?'disabled':'')+' onclick="go('+(page-1)+')">上一頁</button><span>'+page+' / '+pages+'</span><button '+(page>=pages?'disabled':'')+' onclick="go('+(page+1)+')">下一頁</button>'}
function go(p){page=p;render();window.scrollTo({top:document.querySelector('.filters').offsetTop-65,behavior:'smooth'})}
const metricLabels=[['g_score','增長動能',25],['p_score','盈利能力',20],['c_score','現金流／資產負債表',15],['v_score','可見度',20],['s_score','策略選擇權',20],['risk_ded','風險扣分',20]];
function metrics(r){return '<div class="scoregrid">'+metricLabels.map(([k,l,max])=>{const v=score(r[k]),w=v===null?0:Math.min(100,Math.abs(v)/max*100);return '<div class="metric"><small>'+l+'</small><b>'+esc(text(v))+(k==='risk_ded'?'':' / '+max)+'</b><div class="bar"><i style="width:'+w+'%"></i></div></div>'}).join('')+'</div>'}
function fields(title,r,items){const body=items.filter(([k])=>text(r[k],'')!=='').map(([k,l])=>'<div class="field"><label>'+esc(l)+'</label><div>'+esc(r[k])+'</div></div>').join('');return body?'<section class="section"><h3>'+esc(title)+'</h3>'+body+'</section>':''}
function recordHtml(r,i,total){return '<article class="record"><div class="recordHead"><b>'+(total>1?'第 '+(i+1)+' 份記錄 · ':'')+esc(text(r.period))+'</b><span><span class="score">'+esc(text(r.score))+'</span> 分 · '+esc(text(r.date))+'</span></div><div class="recordBody">'+metrics(r)+'<div class="sections">'+fields('定位與核心判斷',r,[['industry','行業／商業模式'],['stage','發展階段'],['category','分類'],['core_judgment','核心判斷']])+fields('財務與營運',r,[['financials','財務主線'],['segment','分部動能'],['cashflow','現金流與資產負債表'],['leading','領先指標／訂單']])+fields('前瞻、催化劑與風險',r,[['guidance','管理層指引／前瞻'],['industry_validation','外部行業驗證'],['catalyst','主要催化劑'],['risk','主要風險'],['outlook','6–18個月展望']])+fields('投資論點與因果鏈',r,[['capital','資本配置／股東回報'],['thesis_valid','投資論點驗證條件'],['thesis_invalid','投資論點失效條件'],['causal_chain','未來判斷因果鏈'],['summary','當時發展全景摘要']])+'</div></div></article>'}
function openCompany(idx){const c=VIEW[idx];if(!c)return;document.getElementById('modalTitle').textContent=c.code+' '+c.name;document.getElementById('modalSub').textContent='歷史快照 · '+c.records.length+'份業績記錄';document.getElementById('modalBody').innerHTML=c.records.map((r,i)=>recordHtml(r,i,c.records.length)).join('');document.getElementById('modal').classList.add('open');document.body.style.overflow='hidden'}
function closeModal(){document.getElementById('modal').classList.remove('open');document.body.style.overflow=''}
['q','industry','category','sort'].forEach(id=>document.getElementById(id).addEventListener(id==='q'?'input':'change',apply));document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});init();
</script>
</body></html>
