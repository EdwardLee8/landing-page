<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #d4a647; text-decoration: none; }
    a:hover { color: #e8bc5a; }
    .num { font-family: Manrope, 'Noto Sans TC', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; background: #0a0a0f; color: #e8e0d0; font-family: 'Noto Sans TC', system-ui, sans-serif; display: flex; overflow: hidden;">

  <div style="width: 218px; flex-shrink: 0; background: #0d0d14; border-right: 1px solid #1c1c26; display: flex; flex-direction: column; padding: 24px 0;">
    <div style="padding: 0 22px 22px;">
      <div class="num" style="font-size: 15px; font-weight: 800; color: #f0ebe0; letter-spacing: -0.01em;">Edward LEE</div>
      <div style="font-size: 11px; color: #6f6a60; margin-top: 3px;">發掘十倍股</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; padding: 0 12px;">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="6">
        <a href="#" style="display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 7px; background: {{n.bg}};">
          <span style="width: 6px; height: 6px; border-radius: 50%; background: {{n.dot}};"></span>
          <span style="font-size: 13px; color: {{n.fg}}; font-weight: {{n.weight}};">{{n.label}}</span>
        </a>
      </sc-for>
    </div>
    <div style="margin-top: auto; padding: 0 22px;">
      <div style="border-top: 1px solid #1c1c26; padding-top: 16px; display: flex; align-items: center; justify-content: space-between;">
        <div style="font-size: 11px; color: #58544c;">會員</div>
        <a href="#" style="font-size: 12px; color: #8b8478;">登出</a>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; overflow: hidden;">
    <!-- 標題 + 市場切換 -->
    <div style="padding: 24px 30px 16px; display: flex; align-items: flex-end; justify-content: space-between;">
      <div>
        <div class="num" style="font-size: 22px; font-weight: 800; color: #f0ebe0; letter-spacing: -0.015em;">港股相對強度評分</div>
        <div style="font-size: 12.5px; color: #6f6a60; margin-top: 4px;">1,208 隻 · 基準 2800.HK · 2026-09-04</div>
      </div>
      <div style="display: flex; background: #12121a; border: 1px solid #1c1c26; border-radius: 9px; padding: 3px;">
        <div style="font-size: 12.5px; padding: 6px 16px; border-radius: 6px; background: #d4a647; color: #0a0a0f; font-weight: 700;">港股</div>
        <a href="#" style="font-size: 12.5px; padding: 6px 16px; border-radius: 6px; color: #8b8478;">美股</a>
        <a href="#" style="font-size: 12.5px; padding: 6px 16px; border-radius: 6px; color: #8b8478;">A 股</a>
      </div>
    </div>

    <!-- 分佈概覽 -->
    <div style="padding: 0 30px 16px; display: flex; gap: 12px;">
      <div style="background: #12121a; border: 1px solid #1c1c26; border-radius: 11px; padding: 13px 18px; flex-grow: 1; display: flex; align-items: center; gap: 20px;">
        <div style="font-size: 11px; color: #6f6a60; white-space: nowrap;">Composite 分佈</div>
        <div style="flex-grow: 1; display: flex; height: 26px; border-radius: 5px; overflow: hidden;">
          <sc-for list="{{dist}}" as="d" hint-placeholder-count="4">
            <div style="width: {{d.w}}; background: {{d.color}}; display: flex; align-items: center; justify-content: center;">
              <span class="num" style="font-size: 10px; font-weight: 700; color: #0a0a0f;">{{d.n}}</span>
            </div>
          </sc-for>
        </div>
        <div style="display: flex; gap: 13px; white-space: nowrap;">
          <span style="font-size: 10px; color: #6f6a60;"><span style="color: #ef5350;">■</span> 1–40</span>
          <span style="font-size: 10px; color: #6f6a60;"><span style="color: #b9853f;">■</span> 41–60</span>
          <span style="font-size: 10px; color: #6f6a60;"><span style="color: #d4a647;">■</span> 61–80</span>
          <span style="font-size: 10px; color: #6f6a60;"><span style="color: #66bb6a;">■</span> 81–99</span>
        </div>
      </div>
      <div style="background: #12121a; border: 1px solid #1c1c26; border-radius: 11px; padding: 13px 18px; display: flex; align-items: center; gap: 10px;">
        <span style="font-size: 11px; color: #6f6a60;">符合篩選</span>
        <span class="num" style="font-size: 20px; font-weight: 700; color: #d4a647;">247</span>
      </div>
    </div>

    <!-- 表格 -->
    <div style="flex-grow: 1; padding: 0 30px 22px; overflow: hidden;">
      <div style="background: #12121a; border: 1px solid #1c1c26; border-radius: 12px; overflow: hidden;">
        <table style="width: 100%; border-collapse: collapse;">
          <thead>
            <tr style="background: #15151e;">
              <th class="num" style="text-align: left; padding: 11px 14px; font-size: 10.5px; color: #6f6a60; font-weight: 600; letter-spacing: 0.05em;">#</th>
              <th style="text-align: left; padding: 11px 10px; font-size: 10.5px; color: #6f6a60; font-weight: 600; letter-spacing: 0.05em;">公司</th>
              <th style="text-align: left; padding: 11px 10px; font-size: 10.5px; color: #6f6a60; font-weight: 600; letter-spacing: 0.05em;">行業</th>
              <th class="num" style="text-align: right; padding: 11px 10px; font-size: 10.5px; color: #6f6a60; font-weight: 600; letter-spacing: 0.05em;">市值</th>
              <th style="text-align: left; padding: 11px 16px; font-size: 10.5px; color: #d4a647; font-weight: 700; letter-spacing: 0.05em;">COMPOSITE</th>
              <th style="text-align: center; padding: 11px 10px; font-size: 10.5px; color: #6f6a60; font-weight: 600; letter-spacing: 0.05em;">近 8 期走勢</th>
              <th style="text-align: center; padding: 11px 14px; font-size: 10.5px; color: #6f6a60; font-weight: 600; letter-spacing: 0.05em;">STAGE</th>
            </tr>
          </thead>
          <tbody>
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="9">
              <tr style="border-top: 1px solid #1a1a23;">
                <td class="num" style="padding: 11px 14px; font-size: 12px; color: #4f4b44;">{{r.n}}</td>
                <td style="padding: 9px 10px;">
                  <div style="display: flex; flex-direction: column; gap: 2px;">
                    <span style="font-size: 13.5px; color: #f0ebe0; font-weight: 500;">{{r.name}}</span>
                    <span class="num" style="font-size: 11px; color: #d4a647;">{{r.code}}</span>
                  </div>
                </td>
                <td style="padding: 9px 10px; font-size: 11.5px; color: #6f6a60;">{{r.sector}}</td>
                <td class="num" style="padding: 9px 10px; font-size: 12.5px; color: #b5ada0; text-align: right;">{{r.cap}}</td>
                <td style="padding: 9px 16px;">
                  <div style="display: flex; align-items: center; gap: 11px;">
                    <span class="num" style="font-size: 18px; font-weight: 800; color: {{r.color}}; min-width: 26px;">{{r.comp}}</span>
                    <div style="width: 88px; height: 5px; background: #1e1e28; border-radius: 3px; overflow: hidden;">
                      <div style="height: 5px; border-radius: 3px; background: {{r.color}}; width: {{r.barWidth}};"></div>
                    </div>
                  </div>
                </td>
                <td style="padding: 9px 10px; text-align: center;">
                  <svg width="112" height="26" viewBox="0 0 112 26" fill="none" preserveAspectRatio="none">
                    <polyline points="{{r.spark}}" stroke="{{r.color}}" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
                  </svg>
                </td>
                <td style="padding: 9px 14px; text-align: center;">
                  <span style="font-size: 11px; padding: 4px 11px; border-radius: 20px; background: {{r.stageBg}}; color: {{r.stageColor}}; white-space: nowrap;">{{r.stage}}</span>
                </td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const color = (c) => (c >= 81 ? '#66bb6a' : c >= 61 ? '#d4a647' : c >= 41 ? '#b9853f' : '#ef5350');
    const spark = (pts) => pts.map((v, i) => (i * (112 / (pts.length - 1))).toFixed(1) + ',' + (25 - v * 0.23).toFixed(1)).join(' ');
    const stageStyle = {
      'Stage 2 上升':  { fg: '#8ee095', bg: 'rgba(102,187,106,0.14)' },
      'Stage 3 頂部':  { fg: '#e8bc5a', bg: 'rgba(232,188,90,0.13)' },
      'Stage 1B 準備': { fg: '#9db9d8', bg: 'rgba(92,155,221,0.13)' },
      'Stage 1 底部':  { fg: '#8b8478', bg: 'rgba(139,132,120,0.10)' },
    };
    const raw = [
      [1,'0700.HK','騰訊控股','Communication Services','38,420億',88,[62,68,71,75,79,84,86,88],'Stage 2 上升'],
      [2,'0259.HK','億都(國際控股)','Technology','28.1億',81,[54,61,66,70,74,77,79,81],'Stage 2 上升'],
      [3,'9988.HK','阿里巴巴-W','Consumer Cyclical','21,870億',79,[58,62,66,69,72,75,77,79],'Stage 2 上升'],
      [4,'8299.HK','大唐黃金','Basic Materials','48.3億',75,[48,52,58,61,66,70,73,75],'Stage 2 上升'],
      [5,'0580.HK','賽晶科技','Technology','26.2億',74,[41,47,54,59,63,68,71,74],'Stage 2 上升'],
      [6,'2425.HK','澳亞集團','Consumer Defensive','22.6億',62,[78,74,71,68,66,64,63,62],'Stage 3 頂部'],
      [7,'3900.HK','綠城中國','Real Estate','212億',60,[36,41,45,49,52,55,58,60],'Stage 2 上升'],
      [8,'1357.HK','美圖公司','Communication Services','198億',45,[22,26,29,33,36,40,43,45],'Stage 1B 準備'],
      [9,'6660.HK','艾美疫苗','Healthcare','36.8億',36,[13,16,18,21,25,29,33,36],'Stage 1B 準備'],
    ];
    return {
      nav: [['總覽',false],['港股',true],['美股',false],['A 股',false],['每日追蹤',false],['ETF',false]]
        .map(([label, active]) => ({
          label,
          bg: active ? 'rgba(212,166,71,0.12)' : 'transparent',
          fg: active ? '#d4a647' : '#8b8478',
          weight: active ? '700' : '400',
          dot: active ? '#d4a647' : '#2e2b26',
        })),
      dist: [
        { n: '412', w: '34%', color: '#ef5350' },
        { n: '318', w: '26%', color: '#b9853f' },
        { n: '231', w: '19%', color: '#d4a647' },
        { n: '247', w: '21%', color: '#66bb6a' },
      ],
      rows: raw.map((r) => ({
        n: r[0], code: r[1], name: r[2], sector: r[3], cap: r[4], comp: r[5], stage: r[7],
        color: color(r[5]),
        barWidth: r[5] + '%',
        spark: spark(r[6]),
        stageColor: stageStyle[r[7]].fg,
        stageBg: stageStyle[r[7]].bg,
      })),
    };
  }
}
</script>
</body>
</html>
